[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-mario-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "stable-baselines3>=2.0",
  "sb3-contrib>=2.0",
  "tensorboard>=2.21",
  "wandb>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
